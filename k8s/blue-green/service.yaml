# Blue-Green Service — traffic router
# Change the slot selector to switch between blue and green.
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    strategy: blue-green
spec:
  type: NodePort
  selector:
    app: aceest-fitness-gym
    slot: blue        # Change to "green" to cut over
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
