# Blue-Green Deployment — BLUE (current stable) slot
#
# In blue-green deployments, two identical environments (blue and green)
# run in parallel. The service selector switches traffic between them.
# Blue = current live version. Green = new version being staged.
#
# Rollback: kubectl patch service aceest-service -p '{"spec":{"selector":{"slot":"blue"}}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    slot: blue
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-gym
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        slot: blue
        version: stable
    spec:
      containers:
        - name: aceest-app
          image: your-dockerhub-username/aceest-fitness-gym:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: APP_SLOT
              value: "blue"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
