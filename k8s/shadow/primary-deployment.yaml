# Shadow Deployment — PRIMARY (live traffic)
#
# Shadow deployment mirrors real production traffic to a shadow instance.
# Users only see responses from primary. Shadow runs silently for comparison.
# Use an Istio or Envoy sidecar to mirror traffic; this manifest defines the primary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    role: primary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-gym
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        role: primary
    spec:
      containers:
        - name: aceest-app
          image: your-dockerhub-username/aceest-fitness-gym:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
