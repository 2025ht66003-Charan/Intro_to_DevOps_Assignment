# Canary Release — CANARY deployment (10% of traffic)
#
# 1 replica alongside 9 stable replicas = ~10% canary traffic.
# Monitor errors and latency before promoting to stable.
# Promote: scale canary to 10, delete stable, rename.
# Roll back: kubectl delete deployment aceest-canary -n aceest-gym
#
# Replace IMAGE_PLACEHOLDER in the Jenkinsfile sed step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        track: canary
    spec:
      containers:
        - name: aceest-app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: RELEASE_TRACK
              value: "canary"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
