# A/B Testing — Version A (control group / existing behaviour)
#
# Users are split between Version A and Version B based on a cookie,
# header, or IP hash set at the ingress/load balancer level.
# Version A = stable baseline. Version B = experimental changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-a
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    variant: version-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-gym
      variant: version-a
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        variant: version-a
    spec:
      containers:
        - name: aceest-app
          image: your-dockerhub-username/aceest-fitness-gym:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: AB_VARIANT
              value: "A"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
