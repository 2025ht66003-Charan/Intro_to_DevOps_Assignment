# A/B Testing — Version B (treatment group / new behaviour)
#
# Route a subset of users to Version B via an ingress annotation such as:
#   nginx.ingress.kubernetes.io/canary: "true"
#   nginx.ingress.kubernetes.io/canary-weight: "50"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-b
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    variant: version-b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-gym
      variant: version-b
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        variant: version-b
    spec:
      containers:
        - name: aceest-app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: AB_VARIANT
              value: "B"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
