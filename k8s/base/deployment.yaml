apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-gym
  namespace: aceest-gym
  labels:
    app: aceest-fitness-gym
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-gym
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        version: stable
    spec:
      containers:
        - name: aceest-app
          image: your-dockerhub-username/aceest-fitness-gym:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
