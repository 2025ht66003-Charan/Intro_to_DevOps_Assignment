# SonarQube project configuration for ACEest Fitness & Gym application

sonar.projectKey=aceest-fitness-gym
sonar.projectName=ACEest Fitness Gym
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=.
sonar.inclusions=app.py
sonar.tests=.
sonar.test.inclusions=test_app.py

# Python language
sonar.language=py
sonar.python.version=3.11

# Coverage reports generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Unit test report generated by pytest --junitxml
sonar.python.xunit.reportPath=xmlreport/test-results.xml

# Exclusions
sonar.exclusions=venv/**,htmlcov/**,**/__pycache__/**,aceestver_*.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate settings
sonar.qualitygate.wait=true
