name: ACEest Fitness Gym — CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/aceest-fitness-gym
  PYTHON_VERSION: "3.11"

jobs:

  # ──────────────────────────────────────────────────────────────
  # JOB 1 — Lint & Syntax
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8 (hard errors)
        run: |
          flake8 app.py test_app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint with flake8 (warnings)
        run: |
          flake8 app.py test_app.py \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Syntax check
        run: python -m py_compile app.py test_app.py

  # ──────────────────────────────────────────────────────────────
  # JOB 2 — Unit Tests
  # ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Pytest with coverage
        run: |
          mkdir -p xmlreport
          pytest test_app.py \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=xmlreport/test-results.xml \
            --html=xmlreport/test-report.html \
            --self-contained-html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            xmlreport/
            htmlcov/
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────
  # JOB 3 — SonarQube Analysis
  # ──────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    if: false() # Temporarily disabled until SonarQube server is stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # JOB 4 — Build & Push Docker Image
  # ──────────────────────────────────────────────────────────────
  build-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # JOB 5 — Docker Container Tests
  # ──────────────────────────────────────────────────────────────
  test-docker:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: build-push-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aceest-fitness-gym:test

      - name: Run tests in Docker container
        run: docker run --rm aceest-fitness-gym:test pytest test_app.py -v --tb=short

      - name: Health check Docker container
        run: |
          CONTAINER_ID=$(docker run -d -p 5000:5000 aceest-fitness-gym:test)
          sleep 8
          curl -f http://localhost:5000/health || (docker stop "$CONTAINER_ID" && exit 1)
          docker stop "$CONTAINER_ID"

  # ──────────────────────────────────────────────────────────────
  # JOB 6 — Deploy to Minikube (Rolling Update)
  # ──────────────────────────────────────────────────────────────
  deploy-rolling:
    name: Deploy — Rolling Update
    runs-on: ubuntu-latest
    needs: test-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Deploy rolling update
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/rolling-update/deployment.yaml
          kubectl set image deployment/aceest-rolling \
            aceest-app=${{ env.DOCKER_HUB_REPO }}:${{ needs.build-push-docker.outputs.image_tag }} \
            -n aceest-gym
          kubectl rollout status deployment/aceest-rolling -n aceest-gym --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -n aceest-gym
          kubectl get services -n aceest-gym

  # ──────────────────────────────────────────────────────────────
  # JOB 7 — Quality Gate Summary
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, test-docker]
    if: always()

    steps:
      - name: Evaluate quality gate
        run: |
          TESTS="${{ needs.unit-tests.result }}"
          DOCKER="${{ needs.test-docker.result }}"

          echo "Unit Tests  : $TESTS"
          echo "Docker Tests: $DOCKER"

          if [[ "$TESTS" == "failure" ]] || [[ "$DOCKER" == "failure" ]]; then
            echo "Quality Gate FAILED"
            exit 1
          fi
          echo "Quality Gate PASSED"
